<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Design 6: Liquid Metal Aurora HM Logo -->
  <defs>
    <!-- Aurora gradient with animation -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:1">
        <animate attributeName="stop-color" values="#00FFAA;#00AAFF;#AA00FF;#FF00AA;#00FFAA" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" style="stop-color:#00AAFF;stop-opacity:1">
        <animate attributeName="stop-color" values="#00AAFF;#AA00FF;#FF00AA;#00FFAA;#00AAFF" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" style="stop-color:#AA00FF;stop-opacity:1">
        <animate attributeName="stop-color" values="#AA00FF;#FF00AA;#00FFAA;#00AAFF;#AA00FF" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF00AA;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF00AA;#00FFAA;#00AAFF;#AA00FF;#FF00AA" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Liquid metal gradient -->
    <radialGradient id="liquidMetal" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#C0C0C0;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#808080;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#404040;stop-opacity:1"/>
    </radialGradient>
    
    <!-- Chrome effect -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="20%" style="stop-color:#E0E0E0;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#A0A0A0;stop-opacity:0.7"/>
      <stop offset="60%" style="stop-color:#606060;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#909090;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Liquid distortion filter -->
    <filter id="liquidDistort">
      <feTurbulence baseFrequency="0.02" numOctaves="3" result="turbulence" seed="1">
        <animate attributeName="baseFrequency" values="0.02;0.04;0.02" dur="8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- Morphing filter -->
    <filter id="morph">
      <feMorphology operator="dilate" radius="1">
        <animate attributeName="radius" values="1;2;1" dur="4s" repeatCount="indefinite"/>
      </feMorphology>
    </filter>
    
    <!-- Metallic reflection -->
    <filter id="metallicShine">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feSpecularLighting result="specOut" specularExponent="20" lighting-color="white">
        <fePointLight x="-50" y="30" z="200">
          <animate attributeName="x" values="-50;250;-50" dur="5s" repeatCount="indefinite"/>
        </fePointLight>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    
    <!-- Aurora glow -->
    <filter id="auroraGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Liquid surface pattern -->
    <pattern id="liquidSurface" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="20" fill="none" stroke="url(#aurora)" stroke-width="0.5" opacity="0.3">
        <animate attributeName="r" values="20;25;20" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="75" cy="75" r="15" fill="none" stroke="url(#aurora)" stroke-width="0.5" opacity="0.3">
        <animate attributeName="r" values="15;20;15" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </pattern>
  </defs>
  
  <!-- Deep space background -->
  <rect width="200" height="200" fill="#000011"/>
  
  <!-- Aurora borealis background effect -->
  <g id="aurora-bg">
    <ellipse cx="100" cy="50" rx="150" ry="60" fill="url(#aurora)" opacity="0.2" filter="url(#auroraGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="150" rx="120" ry="50" fill="url(#aurora)" opacity="0.15" filter="url(#auroraGlow)">
      <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="25s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Liquid metal sphere container -->
  <g id="metal-sphere">
    <!-- Base sphere with liquid effect -->
    <circle cx="100" cy="100" r="85" fill="url(#liquidMetal)" filter="url(#liquidDistort)" opacity="0.9"/>
    
    <!-- Chrome overlay -->
    <circle cx="100" cy="100" r="83" fill="none" stroke="url(#chrome)" stroke-width="2" filter="url(#metallicShine)"/>
    
    <!-- Liquid surface -->
    <circle cx="100" cy="100" r="80" fill="url(#liquidSurface)" opacity="0.5"/>
  </g>
  
  <!-- HM Letters in Liquid Metal Style -->
  <g id="hm-liquid" filter="url(#metallicShine)">
    <!-- H Letter with morphing effect -->
    <g id="h-liquid" filter="url(#morph)">
      <!-- Base metal H -->
      <rect x="40" y="55" width="18" height="90" fill="url(#chrome)" rx="3" ry="3"/>
      <rect x="40" y="90" width="45" height="18" fill="url(#chrome)" rx="3" ry="3"/>
      <rect x="67" y="55" width="18" height="90" fill="url(#chrome)" rx="3" ry="3"/>
      
      <!-- Aurora reflection on H -->
      <rect x="42" y="57" width="14" height="86" fill="url(#aurora)" opacity="0.4" rx="2" ry="2"/>
      <rect x="69" y="57" width="14" height="86" fill="url(#aurora)" opacity="0.4" rx="2" ry="2"/>
      
      <!-- Liquid drops effect -->
      <ellipse cx="49" cy="145" rx="4" ry="2" fill="url(#chrome)">
        <animate attributeName="cy" values="145;150;145" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="2;4;2" dur="2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- M Letter with morphing effect -->
    <g id="m-liquid" filter="url(#morph)">
      <!-- Base metal M -->
      <rect x="95" y="55" width="18" height="90" fill="url(#chrome)" rx="3" ry="3"/>
      <polygon points="113,55 125,85 137,55 155,55 140,95 125,70 110,95 95,55" fill="url(#chrome)"/>
      <rect x="125" y="55" width="18" height="90" fill="url(#chrome)" rx="3" ry="3"/>
      <rect x="145" y="55" width="18" height="90" fill="url(#chrome)" rx="3" ry="3"/>
      
      <!-- Aurora reflection on M -->
      <rect x="97" y="57" width="14" height="86" fill="url(#aurora)" opacity="0.4" rx="2" ry="2"/>
      <rect x="127" y="57" width="14" height="86" fill="url(#aurora)" opacity="0.4" rx="2" ry="2"/>
      <rect x="147" y="57" width="14" height="86" fill="url(#aurora)" opacity="0.4" rx="2" ry="2"/>
      
      <!-- Liquid drops effect -->
      <ellipse cx="125" cy="145" rx="3" ry="2" fill="url(#chrome)">
        <animate attributeName="cy" values="145;148;145" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="2;3;2" dur="2.3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="154" cy="145" rx="3" ry="2" fill="url(#chrome)">
        <animate attributeName="cy" values="145;149;145" dur="2.7s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="2;3.5;2" dur="2.7s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
  
  <!-- Floating liquid metal particles -->
  <g id="particles-metal">
    <circle cx="30" cy="30" r="2" fill="url(#chrome)" filter="url(#metallicShine)">
      <animate attributeName="cy" values="30;170;30" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;4;2" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="170" r="3" fill="url(#chrome)" filter="url(#metallicShine)">
      <animate attributeName="cy" values="170;30;170" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;2;3" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="100" r="2" fill="url(#aurora)" opacity="0.7">
      <animate attributeName="cx" values="20;180;20" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="50" r="2" fill="url(#aurora)" opacity="0.7">
      <animate attributeName="cx" values="180;20;180" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Aurora light streaks -->
  <g id="aurora-streaks" opacity="0.4">
    <path d="M 0,50 Q 100,70 200,50" stroke="url(#aurora)" stroke-width="2" fill="none" filter="url(#auroraGlow)">
      <animate attributeName="d" values="M 0,50 Q 100,70 200,50;M 0,50 Q 100,30 200,50;M 0,50 Q 100,70 200,50" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 0,150 Q 100,130 200,150" stroke="url(#aurora)" stroke-width="2" fill="none" filter="url(#auroraGlow)">
      <animate attributeName="d" values="M 0,150 Q 100,130 200,150;M 0,150 Q 100,170 200,150;M 0,150 Q 100,130 200,150" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Metallic shine overlay -->
  <ellipse cx="80" cy="60" rx="40" ry="20" fill="white" opacity="0.2" filter="url(#liquidDistort)"/>
  
  <!-- Reflection highlight -->
  <ellipse cx="100" cy="40" rx="60" ry="25" fill="url(#chrome)" opacity="0.3"/>
</svg>