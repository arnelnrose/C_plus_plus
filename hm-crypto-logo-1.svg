<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Design 1: Geometric Blockchain-Inspired HM Logo -->
  <defs>
    <!-- Gradient for modern crypto feel -->
    <linearGradient id="cryptoGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Hexagon pattern for blockchain feel -->
    <pattern id="hexPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <polygon points="15,2 27,8 27,22 15,28 3,22 3,8" fill="none" stroke="url(#cryptoGradient1)" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background circle with pattern -->
  <circle cx="100" cy="100" r="95" fill="#0A0E27" stroke="url(#cryptoGradient1)" stroke-width="2"/>
  <circle cx="100" cy="100" r="85" fill="url(#hexPattern)" opacity="0.5"/>
  
  <!-- Hexagon frame -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" 
           fill="none" 
           stroke="url(#cryptoGradient1)" 
           stroke-width="3"
           opacity="0.8"/>
  
  <!-- HM Letters in modern geometric style -->
  <!-- H Letter -->
  <g id="h-letter">
    <rect x="45" y="60" width="12" height="80" fill="url(#cryptoGradient1)"/>
    <rect x="45" y="94" width="35" height="12" fill="url(#cryptoGradient1)"/>
    <rect x="68" y="60" width="12" height="80" fill="url(#cryptoGradient1)"/>
  </g>
  
  <!-- M Letter -->
  <g id="m-letter">
    <rect x="90" y="60" width="12" height="80" fill="url(#cryptoGradient1)"/>
    <polygon points="102,60 110,85 118,60 130,60 120,90 110,70 100,90 90,60" fill="url(#cryptoGradient1)"/>
    <rect x="118" y="60" width="12" height="80" fill="url(#cryptoGradient1)"/>
    <rect x="143" y="60" width="12" height="80" fill="url(#cryptoGradient1)"/>
  </g>
  
  <!-- Decorative blockchain nodes -->
  <circle cx="30" cy="60" r="4" fill="#00D4FF" opacity="0.8"/>
  <circle cx="170" cy="60" r="4" fill="#00D4FF" opacity="0.8"/>
  <circle cx="170" cy="140" r="4" fill="#00D4FF" opacity="0.8"/>
  <circle cx="30" cy="140" r="4" fill="#00D4FF" opacity="0.8"/>
  <circle cx="100" cy="20" r="4" fill="#00D4FF" opacity="0.8"/>
  <circle cx="100" cy="180" r="4" fill="#00D4FF" opacity="0.8"/>
  
  <!-- Connecting lines -->
  <line x1="30" y1="60" x2="100" y2="20" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="20" x2="170" y2="60" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
  <line x1="170" y1="140" x2="100" y2="180" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="180" x2="30" y2="140" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
</svg>