<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for modern crypto look -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5B73FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9D4EDD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Outer glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- H Letter -->
  <g transform="translate(60, 60)">
    <!-- Left vertical line of H -->
    <rect x="0" y="0" width="8" height="80" fill="white" rx="4"/>
    <!-- Right vertical line of H -->
    <rect x="32" y="0" width="8" height="80" fill="white" rx="4"/>
    <!-- Horizontal line of H -->
    <rect x="0" y="36" width="40" height="8" fill="white" rx="4"/>
  </g>
  
  <!-- M Letter -->
  <g transform="translate(100, 60)">
    <!-- Left vertical line of M -->
    <rect x="0" y="0" width="8" height="80" fill="white" rx="4"/>
    <!-- Right vertical line of M -->
    <rect x="32" y="0" width="8" height="80" fill="white" rx="4"/>
    <!-- Left diagonal of M -->
    <polygon points="8,0 20,40 12,40 8,8" fill="white"/>
    <!-- Right diagonal of M -->
    <polygon points="32,8 28,40 20,40 32,0" fill="white"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="rgba(255,255,255,0.6)"/>
  <circle cx="150" cy="150" r="3" fill="rgba(255,255,255,0.6)"/>
  <circle cx="150" cy="50" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="50" cy="150" r="2" fill="rgba(255,255,255,0.4)"/>
</svg>