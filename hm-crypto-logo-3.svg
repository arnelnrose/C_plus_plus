<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Design 3: Cryptocurrency Coin Style HM Logo -->
  <defs>
    <!-- Gold gradient for premium crypto coin feel -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Silver gradient for contrast -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A8A8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Metallic shine effect -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    
    <!-- 3D shadow effect -->
    <filter id="coinShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark premium background -->
  <rect width="200" height="200" fill="#1A1A2E"/>
  
  <!-- Outer coin ring with gradient -->
  <circle cx="100" cy="100" r="90" 
          fill="url(#goldGradient)" 
          filter="url(#coinShadow)"/>
  
  <!-- Inner coin circle -->
  <circle cx="100" cy="100" r="80" 
          fill="#2C2C3E"/>
  
  <!-- Coin edge pattern -->
  <g id="coin-edges">
    <path d="M 100,10 A 90,90 0 0,1 190,100" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
    <path d="M 190,100 A 90,90 0 0,1 100,190" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.3"/>
    <path d="M 100,190 A 90,90 0 0,1 10,100" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.3"/>
    <path d="M 10,100 A 90,90 0 0,1 100,10" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Decorative coin ridges -->
  <g id="ridges">
    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGradient)" stroke-width="0.5" stroke-dasharray="2,3"/>
    <circle cx="100" cy="100" r="75" fill="none" stroke="url(#goldGradient)" stroke-width="0.5" stroke-dasharray="2,3"/>
  </g>
  
  <!-- HM Letters in bold coin style -->
  <g id="hm-coin" filter="url(#innerShadow)">
    <!-- H Letter -->
    <g id="h-coin">
      <rect x="40" y="55" width="15" height="90" fill="url(#goldGradient)"/>
      <rect x="40" y="92" width="40" height="15" fill="url(#goldGradient)"/>
      <rect x="65" y="55" width="15" height="90" fill="url(#goldGradient)"/>
      <!-- Shine effect on H -->
      <rect x="42" y="55" width="5" height="90" fill="url(#shine)" opacity="0.6"/>
      <rect x="67" y="55" width="5" height="90" fill="url(#shine)" opacity="0.6"/>
    </g>
    
    <!-- M Letter -->
    <g id="m-coin">
      <rect x="90" y="55" width="15" height="90" fill="url(#goldGradient)"/>
      <polygon points="105,55 115,85 125,55 140,55 125,95 115,75 105,95 90,55" fill="url(#goldGradient)"/>
      <rect x="125" y="55" width="15" height="90" fill="url(#goldGradient)"/>
      <rect x="145" y="55" width="15" height="90" fill="url(#goldGradient)"/>
      <!-- Shine effect on M -->
      <rect x="92" y="55" width="5" height="90" fill="url(#shine)" opacity="0.6"/>
      <rect x="127" y="55" width="5" height="90" fill="url(#shine)" opacity="0.6"/>
      <rect x="147" y="55" width="5" height="90" fill="url(#shine)" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Blockchain-style decorative elements -->
  <g id="blockchain-decor" opacity="0.6">
    <!-- Top decoration -->
    <circle cx="100" cy="25" r="3" fill="#FFD700"/>
    <line x1="90" y1="25" x2="110" y2="25" stroke="#FFD700" stroke-width="1"/>
    
    <!-- Bottom decoration -->
    <circle cx="100" cy="175" r="3" fill="#FFD700"/>
    <line x1="90" y1="175" x2="110" y2="175" stroke="#FFD700" stroke-width="1"/>
    
    <!-- Side decorations -->
    <circle cx="25" cy="100" r="3" fill="#FFD700"/>
    <line x1="25" y1="90" x2="25" y2="110" stroke="#FFD700" stroke-width="1"/>
    
    <circle cx="175" cy="100" r="3" fill="#FFD700"/>
    <line x1="175" y1="90" x2="175" y2="110" stroke="#FFD700" stroke-width="1"/>
  </g>
  
  <!-- Subtle shine overlay -->
  <ellipse cx="100" cy="60" rx="60" ry="30" fill="url(#shine)" opacity="0.3"/>
  
  <!-- Copyright protection text (optional) -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle" opacity="0.5">HM CRYPTO</text>
</svg>