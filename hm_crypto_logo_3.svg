<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Electric blue to purple gradient -->
    <radialGradient id="grad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0080FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8000FF;stop-opacity:1" />
    </radialGradient>
    
    <!-- Neon glow effect -->
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad3)" stroke-width="8" filter="url(#neon)"/>
  
  <!-- Inner background -->
  <circle cx="100" cy="100" r="75" fill="rgba(0,0,0,0.1)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- H Letter - Futuristic style -->
  <g transform="translate(65, 75)">
    <!-- Left vertical line -->
    <rect x="0" y="0" width="10" height="50" fill="white" rx="5"/>
    <!-- Right vertical line -->
    <rect x="20" y="0" width="10" height="50" fill="white" rx="5"/>
    <!-- Horizontal connector -->
    <rect x="0" y="20" width="30" height="10" fill="white" rx="5"/>
    <!-- Tech accent lines -->
    <rect x="5" y="5" width="2" height="15" fill="url(#grad3)"/>
    <rect x="23" y="30" width="2" height="15" fill="url(#grad3)"/>
  </g>
  
  <!-- M Letter - Futuristic style -->
  <g transform="translate(105, 75)">
    <!-- Left vertical line -->
    <rect x="0" y="0" width="10" height="50" fill="white" rx="5"/>
    <!-- Right vertical line -->
    <rect x="20" y="0" width="10" height="50" fill="white" rx="5"/>
    <!-- Left diagonal -->
    <polygon points="10,0 15,25 10,25 10,5" fill="white"/>
    <!-- Right diagonal -->
    <polygon points="20,5 20,25 15,25 20,0" fill="white"/>
    <!-- Tech accent lines -->
    <rect x="5" y="30" width="2" height="15" fill="url(#grad3)"/>
    <rect x="23" y="5" width="2" height="15" fill="url(#grad3)"/>
  </g>
  
  <!-- Digital circuit patterns -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none">
    <path d="M 30 100 L 50 100 L 50 80 L 70 80"/>
    <path d="M 170 100 L 150 100 L 150 120 L 130 120"/>
    <path d="M 100 30 L 100 50 L 120 50 L 120 70"/>
    <path d="M 100 170 L 100 150 L 80 150 L 80 130"/>
  </g>
  
  <!-- Corner accent dots -->
  <circle cx="40" cy="40" r="4" fill="url(#grad3)" opacity="0.8"/>
  <circle cx="160" cy="40" r="4" fill="url(#grad3)" opacity="0.8"/>
  <circle cx="40" cy="160" r="4" fill="url(#grad3)" opacity="0.8"/>
  <circle cx="160" cy="160" r="4" fill="url(#grad3)" opacity="0.8"/>
</svg>