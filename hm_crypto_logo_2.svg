<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold to orange gradient -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow effect -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Hexagonal background (blockchain inspired) -->
  <polygon points="100,20 160,55 160,125 100,160 40,125 40,55" 
           fill="url(#grad2)" 
           stroke="rgba(255,255,255,0.3)" 
           stroke-width="2" 
           filter="url(#shadow)"/>
  
  <!-- Inner hexagon for depth -->
  <polygon points="100,35 145,60 145,120 100,145 55,120 55,60" 
           fill="none" 
           stroke="rgba(255,255,255,0.2)" 
           stroke-width="1"/>
  
  <!-- H Letter - Modern geometric style -->
  <g transform="translate(65, 70)">
    <!-- Left part of H -->
    <rect x="0" y="0" width="6" height="60" fill="white" rx="3"/>
    <!-- Right part of H -->
    <rect x="24" y="0" width="6" height="60" fill="white" rx="3"/>
    <!-- Middle bar of H -->
    <rect x="0" y="27" width="30" height="6" fill="white" rx="3"/>
  </g>
  
  <!-- M Letter - Modern geometric style -->
  <g transform="translate(105, 70)">
    <!-- Left part of M -->
    <rect x="0" y="0" width="6" height="60" fill="white" rx="3"/>
    <!-- Right part of M -->
    <rect x="24" y="0" width="6" height="60" fill="white" rx="3"/>
    <!-- Center peak of M -->
    <polygon points="6,0 15,30 9,30 6,6" fill="white"/>
    <polygon points="24,6 21,30 15,30 24,0" fill="white"/>
  </g>
  
  <!-- Blockchain-inspired connecting lines -->
  <line x1="40" y1="80" x2="25" y2="65" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="160" y1="80" x2="175" y2="65" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="40" y1="120" x2="25" y2="135" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="160" y1="120" x2="175" y2="135" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>