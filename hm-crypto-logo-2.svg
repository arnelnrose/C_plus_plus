<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Design 2: Minimalist Circuit-Inspired HM Logo -->
  <defs>
    <!-- Purple to Pink gradient for modern tech feel -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B2FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2E63;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Circuit pattern -->
    <pattern id="circuitPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#7B2FFF" opacity="0.3"/>
      <line x1="5" y1="5" x2="35" y2="5" stroke="#7B2FFF" stroke-width="0.5" opacity="0.2"/>
      <line x1="5" y1="5" x2="5" y2="35" stroke="#7B2FFF" stroke-width="0.5" opacity="0.2"/>
      <circle cx="35" cy="35" r="1.5" fill="#FF2E63" opacity="0.3"/>
      <line x1="35" y1="35" x2="5" y2="35" stroke="#FF2E63" stroke-width="0.5" opacity="0.2"/>
      <line x1="35" y1="35" x2="35" y2="5" stroke="#FF2E63" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Dark background -->
  <rect width="200" height="200" fill="#0D0D0D"/>
  
  <!-- Circuit pattern background -->
  <rect width="200" height="200" fill="url(#circuitPattern)"/>
  
  <!-- Main container square with rounded corners -->
  <rect x="20" y="20" width="160" height="160" rx="20" ry="20" 
        fill="none" 
        stroke="url(#techGradient)" 
        stroke-width="2"
        opacity="0.8"/>
  
  <!-- Inner glow square -->
  <rect x="30" y="30" width="140" height="140" rx="15" ry="15" 
        fill="none" 
        stroke="url(#techGradient)" 
        stroke-width="1"
        opacity="0.3"
        filter="url(#glow)"/>
  
  <!-- HM Letters in sleek minimalist style -->
  <!-- H Letter with connected design -->
  <g id="h-minimal">
    <path d="M 50 60 L 50 140 M 80 60 L 80 140 M 50 100 L 80 100" 
          stroke="url(#techGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          fill="none"
          filter="url(#glow)"/>
  </g>
  
  <!-- M Letter with flowing design -->
  <g id="m-minimal">
    <path d="M 100 140 L 100 60 L 115 90 L 130 60 L 130 140 M 130 60 L 145 90 L 160 60 L 160 140" 
          stroke="url(#techGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          filter="url(#glow)"/>
  </g>
  
  <!-- Tech dots decoration -->
  <g id="tech-dots">
    <circle cx="20" cy="20" r="3" fill="#7B2FFF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="20" r="3" fill="#FF2E63" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="180" r="3" fill="#7B2FFF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="180" r="3" fill="#FF2E63" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Subtle circuit lines -->
  <g id="circuit-lines" opacity="0.3">
    <line x1="20" y1="20" x2="40" y2="20" stroke="url(#techGradient)" stroke-width="1"/>
    <line x1="20" y1="20" x2="20" y2="40" stroke="url(#techGradient)" stroke-width="1"/>
    <line x1="180" y1="20" x2="160" y2="20" stroke="url(#techGradient)" stroke-width="1"/>
    <line x1="180" y1="20" x2="180" y2="40" stroke="url(#techGradient)" stroke-width="1"/>
    <line x1="180" y1="180" x2="160" y2="180" stroke="url(#techGradient)" stroke-width="1"/>
    <line x1="180" y1="180" x2="180" y2="160" stroke="url(#techGradient)" stroke-width="1"/>
    <line x1="20" y1="180" x2="40" y2="180" stroke="url(#techGradient)" stroke-width="1"/>
    <line x1="20" y1="180" x2="20" y2="160" stroke="url(#techGradient)" stroke-width="1"/>
  </g>
</svg>